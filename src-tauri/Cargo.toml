[package]
name = "nidham"
version = "0.1.0"
description = "Nidham — 90-Day Personal Operating System"
authors = ["Mohammed Hachoud"]
license = "MIT"
repository = "https://github.com/mohammedhachoud/nidham"
edition = "2021"
rust-version = "1.77.2"

# Tauri requires a library crate for mobile targets; desktop uses the binary.
[lib]
name = "nidham_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri            = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
